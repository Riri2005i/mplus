<style>
:root{--bg:#0d0d10;--card:#1a1a20;--c2:#23232b;--line:#2b2b35;--p:#8b5cf6;--t:#f2f2f7;--m:#9a9aa8;--r:#ef4444;--g:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,Tahoma,Arial,sans-serif;font-size:16px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
input,select,textarea{width:100%;background:#111116;color:var(--t);border:1px solid var(--line);border-radius:12px;padding:12px;margin:5px 0;font:inherit}
button{font:inherit;color:var(--t);cursor:pointer}
.btn{display:block;width:100%;text-align:center;background:var(--p);border:0;border-radius:12px;padding:12px;margin:6px 0}
.btn.s{background:var(--c2)}.btn.d{background:#7f1d1d}
.page{padding:16px;max-width:720px;margin:auto}
h2{margin:6px 0 10px}h3{margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 0;display:block}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.m{color:var(--m);font-size:13px}.p{color:var(--p)}.empty{color:var(--m);text-align:center;padding:24px}
.err{color:var(--r);min-height:1em;margin:4px 0}.ok{color:var(--g)}
.auth{max-width:380px;margin:0 auto;padding:24px;text-align:center}
.logo{width:110px;height:110px;border-radius:24px;object-fit:cover}
.auth h1{color:var(--p);margin:8px 0 0}.sub{color:var(--m);margin:0 0 14px}
.link{background:none;border:0;color:var(--p);padding:8px}
#nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#121217;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
#nav a{flex:1;text-align:center;font-size:11px;color:var(--m);display:flex;flex-direction:column;gap:2px;padding:4px 0}
#nav a span{font-size:20px}#nav a.on{color:var(--p)}
.hero{background:linear-gradient(135deg,#4c1d95,#7c3aed,#8b5cf6);border-radius:28px;padding:20px;display:flex;align-items:center;gap:12px}
.hero small{color:#e9d5ff}.hero b{font-size:26px;display:block}
.ring{width:88px;height:88px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:#ffffff44}.ring .fg{stroke:#fff;transition:stroke-dashoffset 1s ease}
.stats{display:flex;gap:8px;margin:10px 0}.stat{flex:1;background:var(--card);border-radius:16px;padding:12px 4px;text-align:center}
.stat b{display:block;color:var(--p);font-size:22px}.stat span{color:var(--m);font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#1f1a2e;border-radius:20px;padding:16px;transition:transform .15s}.tile:active{transform:scale(.96)}
.tile i{font-style:normal;font-size:30px;display:block}.tile b{display:block;margin-top:6px}.tile span{color:var(--m);font-size:12px}
.cont{background:#2a1f4d;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;margin:10px 0}
.car{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.car .card{min-width:210px;scroll-snap-align:start;margin:0}
.badge{background:var(--p);color:#fff;border-radius:8px;padding:1px 8px;font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;font-weight:400}
.chip.on{background:var(--p);border-color:var(--p)}
.star{background:none;border:0;font-size:24px;color:var(--m)}.star.on{color:var(--p)}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:6px 0}
.opt.on{background:#3b2a6b;border-color:var(--p)}
.bar{height:6px;background:var(--c2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.warn{background:#3b2a12;color:#fcd34d;border-radius:14px;padding:12px;font-size:13px;margin:8px 0}
.field b{color:var(--p);font-size:13px;display:block}.field{margin:10px 0;white-space:pre-wrap}
.pages canvas{width:100%;display:block;margin:4px 0;background:#fff;border-radius:6px}
.spin{text-align:center;padding:40px;color:var(--m)}
.banner{background:#2a1f4d;border-radius:16px;padding:12px;margin-bottom:10px;font-size:13px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;padding:10px 16px;border-radius:12px;display:none;z-index:30;max-width:90%}
.top{display:flex;align-items:center;gap:8px}.back{background:none;border:0;color:var(--p);font-size:16px;padding:8px 0}
</style>

<script>
const URL_='https://bihuibwjjlvbdzppfnjd.supabase.co',KEY='sb_publishable_uSQuyTIIa3SoQX3921H3LQ_y8_Gy-N8';
const sb=supabase.createClient(URL_,KEY);
const $=s=>document.querySelector(s),app=$('#app');

const spin=()=>view('<div class="spin">جارٍ التحميل...</div>');

const all=async a=>(await Promise.all(a)).map(r=>{if(r.error)throw r.error;return r});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3000)}
function msg(e){const m=String(e&&e.message||'');
 if(!navigator.onLine||/fetch|network|load failed/i.test(m))return 'لا يوجد اتصال بالإنترنت. تحقق من الشبكة وحاول مجدداً.';
 if(/invalid login/i.test(m))return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
 if(/already/i.test(m))return 'هذا البريد مسجّل مسبقاً.';
 if(/password/i.test(m))return 'كلمة المرور غير مقبولة (6 أحرف على الأقل).';
 if(/rate|too many/i.test(m))return 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.';
 if(/confirm/i.test(m))return 'يجب تأكيد البريد الإلكتروني أولاً.';
 return 'تعذر تنفيذ الطلب. حاول مرة أخرى.'}
const LS='id,title,description,lecture_number,pdf_path,video_url,allow_download,is_new,subject_id,created_at,subjects(name)';
const TABS=[['home','🏠','الرئيسية'],['lectures','📚','المحاضرات'],['exams','📝','الاختبارات'],['lab','🔬','الموسوعة'],['me','👤','حسابي']];

function nav(on){const n=$('#nav');if(!on){n.style.display='none';return}n.style.display='flex';n.innerHTML=TABS.map(([k,i,l])=>`<a href="#/${k}" class="${on===k?'on':''}"><span>${i}</span>${l}</a>`).join('')}
const fail=e=>{nav(null);view(`<div class="page"><div class="card" style="text-align:center"><p>${esc(msg(e))}</p><button class="btn" data-act="reload">إعادة المحاولة</button></div></div>`)};
const back=(t='رجوع')=>`<button class="back" data-act="back">‹ ${t}</button>`;
const lrow=(l,f)=>`<div class="card row"><a class="grow" href="#/lecture/${l.id}"><b>${l.lecture_number?esc(l.lecture_number)+'. ':''}${esc(l.title)}</b> ${l.is_new?'<span class="badge">جديد</span>':''}<div class="m">${esc(l.subjects?.name||'')}</div></a><button class="star ${f?'on':''}" data-act="fav" data-id="${l.id}">${f?'★':'☆'}</button></div>`;
const DISC='<div class="warn">⚠ القيم المرجعية تختلف باختلاف المختبر والجهاز والعمر والجنس، ومرجع المختبر هو الأساس في تفسير النتائج.</div>';

/* ---------- الدخول ---------- */
async function authView(info,err){
 nav(null);let st=[];
 if(AM==='register'){try{st=(await sb.from('stages').select('id,name').order('sort_order')).data||[]}catch(e){}}
 const T={login:'تسجيل الدخول',register:'إنشاء حساب جديد',forgot:'استعادة كلمة المرور',reset:'تعيين كلمة مرور جديدة'}[AM];
 view(`<div class="auth"><img src="IMG_4027.jpeg" class="logo"><h1>M+ Analyses</h1><p class="sub">Medical Laboratory Education</p><h3>${T}</h3>
 ${AM==='register'?`<input id="a_name" placeholder="الاسم الكامل"><input id="a_uni" placeholder="الجامعة (اختياري)"><input id="a_dept" placeholder="القسم الدراسي"><select id="a_stage"><option value="">المرحلة الدراسية</option>${st.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`:''}
 ${AM!=='reset'?'<input id="a_email" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="email">':''}
 ${AM!=='forgot'?'<input id="a_pw" type="password" dir="ltr" placeholder="كلمة المرور" autocomplete="current-password">':''}
 <p class="err">${esc(err||'')}</p><p class="ok">${esc(info||'')}</p>
 <button class="btn" data-act="submit">${{login:'دخول',register:'إنشاء الحساب',forgot:'إرسال رابط الاستعادة',reset:'حفظ'}[AM]}</button>
 ${AM==='login'?'<button class="link" data-act="mode" data-m="forgot">نسيت كلمة المرور؟</button><br>':''}
 ${AM!=='reset'?`<button class="link" data-act="mode" data-m="${AM==='login'?'register':'login'}">${AM==='login'?'ليس لديك حساب؟ أنشئ حساباً':'العودة لتسجيل الدخول'}</button>`:''}</div>`)}
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){ME=null;return authView()}
 ME=session.user;
 const {data:p}=await sb.from('profiles').select('*').eq('id',ME.id).single();
 if(!p||!p.is_active){await sb.auth.signOut();ME=null;AM='login';return authView('','هذا الحساب معطّل. تواصل مع الإدارة.')}
 PROFILE=p;if(!location.hash)location.hash='#/home';render()}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){AM='reset';ME=null;authView()}});

/* ---------- الإجراءات ---------- */
const ACT={
 reload:()=>render(),back:()=>history.back(),
 mode:el=>{AM=el.dataset.m;authView()},
 async submit(){
  const v=id=>($('#'+id)?.value||'').trim(),email=v('a_email'),pw=$('#a_pw')?.value||'';
  try{
   if(AM==='login'){if(!email||!pw)return authView('','أدخل البريد وكلمة المرور.');const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;await init()}
   else if(AM==='register'){if(!v('a_name')||!email||pw.length<6||!v('a_stage'))return authView('','أكمل الحقول المطلوبة (كلمة المرور 6 أحرف على الأقل واختر المرحلة).');
    const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:v('a_name'),university:v('a_uni'),department:v('a_dept'),stage_id:v('a_stage')}}});if(error)throw error;
    if(data.session)await init();else{AM='login';authView('تم إنشاء الحساب. افتح بريدك لتأكيده ثم سجّل الدخول.')}}
   else if(AM==='forgot'){if(!email)return authView('','أدخل بريدك.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;authView('تم إرسال رابط الاستعادة إلى بريدك.')}
   else if(AM==='reset'){if(pw.length<6)return authView('','6 أحرف على الأقل.');const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;AM='login';await init()}
  }catch(e){authView('',msg(e))}},
 async logout(){await sb.auth.signOut();ME=null;AM='login';location.hash='';authView()},
 async fav(el){const id=el.dataset.id,on=FAV.has(id);on?FAV.delete(id):FAV.add(id);el.textContent=on?'☆':'★';el.classList.toggle('on',!on);
  const r=on?await sb.from('favorites').delete().eq('lecture_id',id).eq('user_id',ME.id):await sb.from('favorites').upsert({user_id:ME.id,lecture_id:id},{onConflict:'user_id,lecture_id'});if(r.error)toast(msg(r.error))},
 async complete(el){el.disabled=true;el.textContent='تم تسجيلها كمكتملة ✓';await sb.from('reading_progress').upsert({user_id:ME.id,lecture_id:el.dataset.id,completed:true,last_read_at:new Date().toISOString()},{onConflict:'user_id,lecture_id'})},
 async dl(el){const {data,error}=await sb.storage.from('lectures').createSignedUrl(el.dataset.p,3600,{download:true});if(error)throw error;location.href=data.signedUrl},
 async ann(el){const id=el.dataset.id;if(el.dataset.u!=='1')return;el.dataset.u='0';el.querySelector('.dot')?.remove();await sb.from('announcement_reads').upsert({user_id:ME.id,announcement_id:id},{onConflict:'user_id,announcement_id'})},
 pick(el){if(X.done)return;X.ans[X.i]=+el.dataset.i;paintQ()},
 next(){X.i++;paintQ()},prev(){X.i--;paintQ()},finish:()=>finish(),
 retry(){const q=X.qs.filter((q,i)=>X.ans[i]!==q.correct_index);RETRY={exam:X.ex.id,qs:q};R.exam(X.ex.id)},
 async saveProfile(){const r=await sb.from('profiles').update({full_name:$('#p_name').value.trim(),university:$('#p_uni').value.trim(),department:$('#p_dept').value.trim()}).eq('id',ME.id);toast(r.error?msg(r.error):'تم حفظ البيانات')},
 async chPw(){const pw=$('#p_pw').value;if(pw.length<6)return toast('6 أحرف على الأقل');const {error}=await sb.auth.updateUser({password:pw});toast(error?msg(error):'تم تغيير كلمة المرور');$('#p_pw').value=''},
 closeBanner(){localStorage.setItem('ib','1');$('#ban')?.remove()}
};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;try{await f(el)}catch(err){toast(msg(err))}});

/* ---------- الصفحات ---------- */
const R={};
R.home=async()=>{spin();
 const [lec,ann,rd,pr,dn,tt,rs]=await all([
  sb.from('lectures').select(LS).eq('status','published').order('created_at',{ascending:false}).limit(8),
  sb.from('announcements').select('id,title,body,created_at').order('created_at',{ascending:false}),
  sb.from('announcement_reads').select('announcement_id'),
  sb.from('reading_progress').select('lectures('+LS+')').eq('completed',false).order('last_read_at',{ascending:false}).limit(1),
  sb.from('reading_progress').select('lecture_id',{count:'exact',head:true}).eq('completed',true),
  sb.from('lectures').select('id',{count:'exact',head:true}).eq('status','published'),
  sb.from('exam_results').select('score,total').order('created_at',{ascending:false}).limit(50)]);
 const rdSet=new Set(rd.data.map(x=>x.announcement_id)),unread=ann.data.filter(a=>!rdSet.has(a.id)).length;
 const last=pr.data[0]?.lectures,done=dn.count||0,total=tt.count||0,pct=total?Math.min(1,done/total):0;
 const good=rs.data.filter(x=>x.total>0),avg=good.length?Math.round(good.reduce((s,x)=>s+x.score*100/x.total,0)/good.length)+'%':'-';
 const h=new Date().getHours(),hi=h<12?'صباح الخير':h<18?'نهارك سعيد':'مساء الخير',first=(PROFILE.full_name||'').trim().split(' ')[0];
 const ios=(/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&!navigator.standalone&&!localStorage.getItem('ib');
 const C=2*Math.PI*40;
 view(`<div class="page">${ios?'<div class="banner" id="ban">📲 لإضافة التطبيق للشاشة الرئيسية: اضغط زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية». <button class="link" data-act="closeBanner">إغلاق</button></div>':''}
 <div class="hero"><div class="grow"><small>${hi}</small><b>${esc(first)}</b><small>أكملت ${done} من ${total} محاضرة</small></div>
 <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" id="rg" cx="50" cy="50" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg></div>
 <div class="stats"><div class="stat"><b>${done}</b><span>محاضرات مكتملة</span></div><div class="stat"><b>${rs.data.length}</b><span>اختبارات</span></div><div class="stat"><b>${avg}</b><span>متوسط النتائج</span></div></div>
 ${last?`<a class="cont" href="#/lecture/${last.id}"><span style="font-size:28px">📖</span><div class="grow"><div class="m p">تابع من حيث توقفت</div><b>${esc(last.title)}</b></div><span class="p">‹</span></a>`:''}
 <h3>الوصول السريع</h3><div class="tiles">
 <a class="tile" href="#/lectures"><i>📚</i><b>المحاضرات</b><span>تصفح وابحث</span></a><a class="tile" href="#/exams"><i>📝</i><b>الاختبارات</b><span>اختبر نفسك</span></a>
 <a class="tile" href="#/lab"><i>🔬</i><b>الموسوعة</b><span>التحاليل والمصطلحات</span></a><a class="tile" href="#/ranges"><i>📊</i><b>المعدلات الطبيعية</b><span>القيم المرجعية</span></a></div>
 <div class="row" style="margin-top:16px"><h3 class="grow" style="margin:0">آخر التبليغات</h3>${unread?`<span class="badge">${unread} جديد</span>`:''}<a class="p" href="#/ann">عرض الكل</a></div>
 ${ann.data.slice(0,3).map(a=>`<a class="card" href="#/ann"><b>${esc(a.title)}</b><div class="m">${esc((a.body||'').slice(0,90))}</div></a>`).join('')||'<p class="empty">لا توجد تبليغات.</p>'}
 <h3>أحدث المحاضرات</h3>${lec.data.length?`<div class="car">${lec.data.map(l=>`<a class="card" href="#/lecture/${l.id}">${l.is_new?'<span class="badge">جديد</span>':'<span>&nbsp;</span>'}<div style="margin:6px 0"><b>${esc(l.title)}</b></div><div class="m">${esc(l.subjects?.name||'')}</div></a>`).join('')}</div>`:'<p class="empty">لا توجد محاضرات منشورة بعد.</p>'}</div>`);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$('#rg');if(g)g.style.strokeDashoffset=C*(1-pct)}))};

R.lectures=async()=>{spin();
 const [sj,lc,fv]=await all([sb.from('subjects').select('id,name').order('sort_order'),sb.from('lectures').select(LS).eq('status','published').order('created_at',{ascending:false}),sb.from('favorites').select('lecture_id')]);
 FAV=new Set(fv.data.map(x=>x.lecture_id));let q='',sub='',of=false;
 view('<div class="page"><h2>المحاضرات</h2><input id="q" placeholder="ابحث عن محاضرة"><div class="chips" id="ch"></div><div id="lst"></div></div>');
 const paint=()=>{$('#ch').innerHTML=`<b class="chip ${of?'on':''}" data-f="fav">★ المفضلة</b><b class="chip ${!sub?'on':''}" data-f="">الكل</b>`+sj.data.map(s=>`<b class="chip ${sub===s.id?'on':''}" data-f="${s.id}">${esc(s.name)}</b>`).join('');
  const L=lc.data.filter(l=>(!q||l.title.toLowerCase().includes(q))&&(!sub||l.subject_id===sub)&&(!of||FAV.has(l.id)));
  $('#lst').innerHTML=L.length?L.map(l=>lrow(l,FAV.has(l.id))).join(''):'<p class="empty">لا توجد محاضرات مطابقة.</p>'};
 $('#q').oninput=e=>{q=e.target.value.toLowerCase();paint()};
 $('#ch').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const f=c.dataset.f;if(f==='fav')of=!of;else sub=f;paint()};paint()};

R.lecture=async id=>{spin();
 const r=await sb.from('lectures').select(LS).eq('id',id).single();if(r.error)throw r.error;const l=r.data;
 sb.from('lecture_views').insert({lecture_id:id,user_id:ME.id}).then(()=>{});
 sb.from('reading_progress').upsert({user_id:ME.id,lecture_id:id,last_read_at:new Date().toISOString()},{onConflict:'user_id,lecture_id'}).then(()=>{});
 view(`<div class="page">${back()}<h2>${esc(l.title)}</h2><div class="p">${esc(l.subjects?.name||'')}</div><p>${esc(l.description||'لا يوجد وصف.')}</p>
 ${l.pdf_path?`<a class="btn" href="#/pdf/${l.id}">فتح ملف PDF</a>`:''}${l.pdf_path&&l.allow_download?`<button class="btn s" data-act="dl" data-p="${esc(l.pdf_path)}">تنزيل الملف</button>`:''}
 ${l.video_url?`<a class="btn s" target="_blank" rel="noopener" href="${esc(l.video_url)}">مشاهدة الفيديو</a>`:''}
 <button class="btn s" data-act="complete" data-id="${l.id}">تمّت قراءتها</button></div>`)};

let PDFJS=null;
const loadJs=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
R.pdf=async id=>{spin();
 const r=await sb.from('lectures').select('title,pdf_path').eq('id',id).single();if(r.error)throw r.error;
 view(`<div class="page">${back()}<h3 style="margin-top:0">${esc(r.data.title)}</h3><div id="pst" class="spin">جارٍ تحميل الملف...</div><div class="pages" id="pages"></div></div>`);
 const {data,error}=await sb.storage.from('lectures').createSignedUrl(r.data.pdf_path,3600);if(error)throw error;
 const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
 if(!PDFJS){await loadJs(base+'pdf.min.js');const w=await (await fetch(base+'pdf.worker.min.js')).blob();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(w);PDFJS=pdfjsLib}
 const buf=await (await fetch(data.signedUrl)).arrayBuffer();
 const pdf=await PDFJS.getDocument({data:buf}).promise;$('#pst')?.remove();
 const box=$('#pages');if(!box)return;const W=box.clientWidth;
 const io=new IntersectionObserver(es=>es.forEach(async e=>{const c=e.target;if(!e.isIntersecting||c.dataset.d)return;c.dataset.d=1;io.unobserve(c);
  const pg=await pdf.getPage(+c.dataset.p),dpr=Math.min(devicePixelRatio||1,2),v=pg.getViewport({scale:W/pg.getViewport({scale:1}).width*dpr});
  c.width=v.width;c.height=v.height;c.style.height=(v.height/dpr)+'px';await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}),{rootMargin:'800px'});
 for(let i=1;i<=pdf.numPages;i++){const c=document.createElement('canvas');c.dataset.p=i;c.style.height='480px';box.appendChild(c);io.observe(c)}};

R.ann=async()=>{spin();
 const [a,rd]=await all([sb.from('announcements').select('*').order('created_at',{ascending:false}),sb.from('announcement_reads').select('announcement_id')]);
 const s=new Set(rd.data.map(x=>x.announcement_id));
 view(`<div class="page">${back()}<h2>التبليغات</h2>${a.data.map(x=>{const u=!s.has(x.id);return `<div class="card" data-act="ann" data-id="${x.id}" data-u="${u?1:0}"><b>${u?'<span class="p dot">● </span>':''}${esc(x.title)}</b>${x.image_url?`<img src="${esc(x.image_url)}" style="width:100%;border-radius:12px;margin:8px 0">`:''}<p>${esc(x.body||'')}</p><div class="m">${dt(x.created_at)}</div></div>`}).join('')||'<p class="empty">لا توجد تبليغات حالياً.</p>'}</div>`)};

R.exams=async()=>{spin();
 const r=await sb.from('exams').select('*,subjects(name)').eq('status','published').order('created_at',{ascending:false});if(r.error)throw r.error;
 view(`<div class="page"><div class="row"><h2 class="grow">الاختبارات</h2><a class="p" href="#/history">سجل نتائجي</a></div>${r.data.map(e=>`<a class="card row" href="#/exam/${e.id}"><span style="font-size:28px">📝</span><div class="grow"><b>${esc(e.title)}</b><div class="m">${esc(e.subjects?.name||'')} • ${e.question_count} سؤال • ${e.duration_minutes} دقيقة</div></div><span class="p">ابدأ ‹</span></a>`).join('')||'<p class="empty">لا توجد اختبارات منشورة بعد.</p>'}</div>`)};

R.exam=async id=>{spin();
 const e=await sb.from('exams').select('*').eq('id',id).single();if(e.error)throw e.error;const ex=e.data;let qs;
 if(RETRY&&RETRY.exam===id){qs=RETRY.qs;RETRY=null}else{const r=await sb.from('questions').select('*').eq('exam_id',id);if(r.error)throw r.error;qs=r.data;if(ex.randomize)qs=shuffle(qs);if(ex.question_count>0)qs=qs.slice(0,ex.question_count)}
 if(!qs.length){nav(null);return view(`<div class="page"><p class="empty">لا توجد أسئلة في هذا الاختبار بعد.</p><a class="btn" href="#/exams">رجوع</a></div>`)}
 nav(null);const total=Math.max(1,ex.duration_minutes||15)*60;
 X={ex,qs,ans:qs.map(()=>-1),i:0,total,left:total,done:false};
 X.t=setInterval(()=>{X.left--;const t=$('#tm');if(t){t.textContent=fmt(X.left);t.style.color=X.left<60?'var(--r)':'var(--p)'}if(X.left<=0)finish()},1000);paintQ()};
function paintQ(){const q=X.qs[X.i],last=X.i===X.qs.length-1;
 view(`<div class="page"><div class="row"><a class="back" href="#/exams">✕ خروج</a><span class="grow"></span><b id="tm" class="p" style="font-size:18px">${fmt(X.left)}</b></div>
 <div class="bar"><i style="width:${(X.i+1)*100/X.qs.length}%"></i></div><p class="m">سؤال ${X.i+1} من ${X.qs.length}</p>
 <h3 style="margin-top:0">${esc(q.question_text)}</h3>${q.options.map((o,i)=>`<button class="opt ${X.ans[X.i]===i?'on':''}" data-act="pick" data-i="${i}">${esc(o)}</button>`).join('')}
 <div class="row">${X.i>0?'<button class="btn s" data-act="prev">السابق</button>':''}${last?'<button class="btn" data-act="finish">إنهاء الاختبار</button>':'<button class="btn" data-act="next">التالي</button>'}</div></div>`)}
async function finish(){if(!X||X.done)return;X.done=true;clearInterval(X.t);
 const sc=X.qs.filter((q,i)=>X.ans[i]===q.correct_index).length,n=X.qs.length,pct=Math.round(sc*100/n),wrong=n-sc;
 view(`<div class="page" style="text-align:center"><div style="font-size:48px">${pct>=50?'🎉':'💪'}</div><h1 class="p" style="margin:0">${sc} / ${n}</h1><p>النتيجة: ${pct}%</p><p class="m" id="sv">جارٍ حفظ نتيجتك...</p>
 ${wrong?`<button class="btn" data-act="retry">إعادة الأسئلة التي أخطأت فيها (${wrong})</button>`:''}<a class="btn s" href="#/exams">خروج</a>
 <h3 style="text-align:right">مراجعة الإجابات</h3>${X.qs.map((q,i)=>{const a=X.ans[i],c=q.correct_index,ok=a===c;return `<div class="card" style="text-align:right"><b>${i+1}. ${esc(q.question_text)}</b><div style="color:var(--${ok?'g':'r'})">إجابتك: ${a<0?'لم تجب':esc(q.options[a])}</div>${ok?'':`<div style="color:var(--g)">الإجابة الصحيحة: ${esc(q.options[c])}</div>`}${q.explanation?`<div class="m">الشرح: ${esc(q.explanation)}</div>`:''}</div>`}).join('')}</div>`);
 try{const r=await sb.from('exam_results').insert({user_id:ME.id,exam_id:X.ex.id,score:sc,total:n,duration_seconds:X.total-Math.max(0,X.left)}).select('id').single();if(r.error)throw r.error;
  const a=await sb.from('student_answers').insert(X.qs.map((q,i)=>({result_id:r.data.id,user_id:ME.id,question_id:q.id,selected_index:X.ans[i]<0?null:X.ans[i],is_correct:X.ans[i]===q.correct_index})));if(a.error)throw a.error;
  const s=$('#sv');if(s)s.textContent='تم حفظ نتيجتك ✓'}catch(e){const s=$('#sv');if(s)s.textContent='تعذر حفظ النتيجة: '+msg(e)}}

R.history=async()=>{spin();
 const r=await sb.from('exam_results').select('score,total,created_at,exams(title)').order('created_at',{ascending:false}).limit(100);if(r.error)throw r.error;
 view(`<div class="page">${back()}<h2>سجل الامتحانات</h2>${r.data.map(o=>{const p=o.total?Math.round(o.score*100/o.total):0;return `<div class="card row"><div class="grow"><b>${esc(o.exams?.title||'اختبار محذوف')}</b><div class="m">${dt(o.created_at)}</div></div><b style="color:var(--${p>=50?'g':'r'})">${o.score}/${o.total} (${p}%)</b></div>`}).join('')||'<p class="empty">لم تؤدِّ أي اختبار بعد.</p>'}</div>`)};

R.lab=async()=>{spin();
 const [s,t]=await all([sb.from('lab_sections').select('id,name_en').order('sort_order'),sb.from('lab_tests').select('id,name_en,name_ar,abbreviation,sample_type,section_id').order('name_en')]);
 let q='',sec='';view('<div class="page"><div class="row"><h2 class="grow">الموسوعة المختبرية</h2><a class="p" href="#/ranges">المعدلات</a></div><input id="q" placeholder="ابحث (عربي / English / اختصار)"><div class="chips" id="ch"></div><div id="lst"></div></div>');
 const paint=()=>{$('#ch').innerHTML=`<b class="chip ${!sec?'on':''}" data-f="">كل الأقسام</b>`+s.data.map(x=>`<b class="chip ${sec===x.id?'on':''}" data-f="${x.id}">${esc(x.name_en)}</b>`).join('');
  const L=t.data.filter(x=>(!sec||x.section_id===sec)&&(!q||[x.name_en,x.name_ar,x.abbreviation].some(v=>(v||'').toLowerCase().includes(q))));
  $('#lst').innerHTML=L.map(x=>`<a class="card" href="#/test/${x.id}"><b>${esc(x.name_en)}${x.abbreviation?' ('+esc(x.abbreviation)+')':''}</b>${x.name_ar?`<div class="p">${esc(x.name_ar)}</div>`:''}${x.sample_type?`<div class="m">العينة: ${esc(x.sample_type)}</div>`:''}</a>`).join('')||'<p class="empty">لا توجد تحاليل مطابقة. يُضاف المحتوى من لوحة الإدارة.</p>'};
 $('#q').oninput=e=>{q=e.target.value.toLowerCase();paint()};$('#ch').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;sec=sec===c.dataset.f?'':c.dataset.f;paint()};paint()};
const fld=(l,v)=>v&&String(v).trim()?`<div class="field"><b>${l}</b>${esc(v)}</div>`:'';
const rcard=(r,title)=>`<div class="card">${title?`<b>${esc(title)}</b>`:''}<div class="p" style="font-size:17px;font-weight:700">${esc(r.value_text)} ${esc(r.unit||'')}</div><div class="m">${[r.age_group,r.sex].filter(Boolean).map(esc).join(' • ')}</div>${r.notes?`<div>${esc(r.notes)}</div>`:''}${r.source?`<div class="m">المصدر: ${esc(r.source)}</div>`:''}</div>`;
R.test=async id=>{spin();
 const [t,r]=await all([sb.from('lab_tests').select('*,lab_sections(name_en)').eq('id',id).single(),sb.from('reference_ranges').select('*').eq('test_id',id)]);const x=t.data;
 view(`<div class="page">${back()}<h2 style="margin-bottom:0">${esc(x.name_en)}</h2><div class="p">${esc(x.name_ar||'')}</div>${fld('الاختصار',x.abbreviation)}${fld('القسم',x.lab_sections?.name_en)}${fld('نوع العينة',x.sample_type)}${fld('الغرض من التحليل',x.purpose)}${fld('مبدأ الفحص',x.principle)}${fld('طريقة القياس',x.method)}${fld('الاستخدامات',x.uses)}${fld('أسباب الارتفاع المحتملة',x.high_causes)}${fld('أسباب الانخفاض المحتملة',x.low_causes)}${fld('ملاحظات علمية',x.notes)}
 ${r.data.length?'<h3>المعدلات المرجعية</h3>'+r.data.map(v=>rcard(v)).join('')+DISC:''}${fld('المصادر والمراجع',x.sources)}</div>`)};
R.ranges=async()=>{spin();
 const r=await sb.from('reference_ranges').select('*,lab_tests(name_en,name_ar,abbreviation)');if(r.error)throw r.error;
 const A=r.data.sort((a,b)=>(a.lab_tests?.name_en||'').localeCompare(b.lab_tests?.name_en||''));
 view('<div class="page">'+back()+'<h2>المعدلات الطبيعية</h2>'+DISC+'<input id="q" placeholder="بحث سريع عن تحليل"><div id="lst"></div></div>');
 const paint=q=>{const L=A.filter(x=>!q||[x.lab_tests?.name_en,x.lab_tests?.name_ar,x.lab_tests?.abbreviation].some(v=>(v||'').toLowerCase().includes(q)));
  $('#lst').innerHTML=L.map(x=>rcard(x,(x.lab_tests?.name_en||'')+(x.lab_tests?.abbreviation?' ('+x.lab_tests.abbreviation+')':''))).join('')||'<p class="empty">لا توجد معدلات مطابقة. يُضاف المحتوى من لوحة الإدارة.</p>'};
 $('#q').oninput=e=>paint(e.target.value.toLowerCase());paint('')};

R.me=async()=>{spin();
 const [p,c]=await all([sb.from('profiles').select('*').eq('id',ME.id).single(),sb.from('reading_progress').select('lecture_id',{count:'exact',head:true}).eq('completed',true)]);PROFILE=p.data;
 view(`<div class="page"><h2>حسابي</h2><div class="m" dir="ltr" style="text-align:right">${esc(ME.email)}</div><p class="p">المحاضرات المكتملة: ${c.count||0}</p>
 <input id="p_name" placeholder="الاسم الكامل" value="${esc(PROFILE.full_name)}"><input id="p_uni" placeholder="الجامعة" value="${esc(PROFILE.university)}"><input id="p_dept" placeholder="القسم الدراسي" value="${esc(PROFILE.department)}">
 <button class="btn" data-act="saveProfile">حفظ التعديلات</button><h3>تغيير كلمة المرور</h3><input id="p_pw" type="password" dir="ltr" placeholder="كلمة المرور الجديدة"><button class="btn s" data-act="chPw">تغيير كلمة المرور</button>
 <button class="btn d" data-act="logout" style="margin-top:24px">تسجيل الخروج</button></div>`)};

async function render(){
 if(!ME)return;if(X&&X.t)clearInterval(X.t);
 const [r,a]=(location.hash.slice(2)||'home').split('/'),f=R[r]||R.home;
 nav(TABS.some(t=>t[0]===r)?r:(R[r]?null:'home'));
 try{await f(a)}catch(e){fail(e)}window.scrollTo(0,0)}
window.addEventListener('hashchange',render);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init().catch(fail);
</script>
